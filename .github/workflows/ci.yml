name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check src/ tests/
      - uses: astral-sh/setup-uv@v6
      - name: Check uv.lock is up to date
        run: uv lock --check

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked environment with dev extras
        run: uv sync --locked --extra dev --python 3.10
      - name: Run tests
        env:
          WANDB_MODE: disabled
          CODIT_DATA_PATH: /tmp/codit_data
        run: uv run --no-sync pytest tests/ -v --tb=short
