[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "CoDiT"
version = "0.0.1"
description = "Conditional Diffusion Trajectory predictions for ocean drifters"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.14"  # flax<0.11 does not support 3.14
authors = [
    {name = "Christian Donner", email = "christian.research@mailbox.org"},
]
classifiers = [
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python",
]
dependencies = [
    "matplotlib",
    "numpy>=1.19.5",
    "cartopy",
    "cdsapi",
    "cfgrib",
    "pyyaml",
    "xarray==2024.2.0",
    "cftime",
    "pandas",
    "jax>=0.4.30,<0.8",  # flax<0.11 breaks with newer jax
    "jaxlib>=0.4.30,<0.8",
    "flax>=0.10.6,<0.11",  # newer flax cannot unpickle the shipped Linear Gaussian checkpoints
    "copernicusmarine",
    "interpax",
    "geopandas",
    "wandb",
    "scipy>=1.7.3",
    "torch",
    "tensorboard",
    "tqdm",
    "h5py",
    "requests",
    "optax",
    "orbax-checkpoint",
]

[project.optional-dependencies]
parcels = ["parcels", "zarr"]
cuda = ["jax[cuda12]>=0.4.30,<0.8"]
dev = [
    "black",
    "ruff",
    "pre-commit",
    "pytest",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
