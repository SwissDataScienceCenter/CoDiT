[metadata]
name = CoDiT
version = 0.0.1
license = MIT
description = Prediction of trajectories in ocean
long_description = file: README.rst
author = Christian Donner
author_email = christian.research(at)mailbox.org
classifiers=
   Topic :: Scientific/Engineering :: Mathematics
   Topic :: Scientific/Engineering :: Artificial Intelligence
   Programming Language :: Python

[options]
packages = find:
package_dir =
    = src
include_package_data = True
python_requires = >=3.8
install_requires =
   matplotlib
   numpy >= 1.19.5
   cartopy
   cdsapi
   cfgrib
   pyyaml
   xarray==2024.2.0
   pandas
   jax >= 0.2.10
   jaxlib >= 0.1.60
   flax>=0.10.6
   copernicusmarine
   interpax
   geopandas
   wandb
   scipy >= 1.7.3
   streamlit==1.25.0
   tensorboard

[options.extras_require]
dev =
   black
   ruff
   mypy
   pre-commit
   types-PyYAML
   
[options.packages.find]
where = src